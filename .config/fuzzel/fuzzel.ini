# ==============================================================================
# Fuzzel Configuration
# Compact, Fine, Horizontal-Rectangular Soft Dark Mode
# Icon Theme: Yet Another Monochrome Icon Set (YAMIS)
# ==============================================================================

font=JetBrainsMono Nerd Font:size=8.5
dpi-aware=auto
use-bold=yes

prompt="  "
placeholder="Search..."
icon-theme=YAMIS
icons-enabled=yes

fields=filename,name,generic,exec,categories,keywords
match-mode=fzf
sort-result=yes
match-counter=no
show-actions=yes
terminal=alacritty -e

# Horizontal-Rectangular Geometry & Layout
anchor=center
lines=5
width=48
horizontal-pad=16
vertical-pad=6
inner-pad=5
image-size-ratio=0.35
line-height=18

layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
# Soft Dark Mode with Neutral Gray Accent
background=222222fa
text=cfcfcfff
prompt=888888ff
placeholder=666666ff
input=ffffffff
match=78aeedff
selection=383838ff
selection-text=ffffffff
selection-match=99c1f1ff
counter=777777ff
border=555555ff

[border]
width=1
radius=2
selection-radius=2
